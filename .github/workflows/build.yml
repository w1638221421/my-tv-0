name: build upgraded apk

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Show current player dependencies
        run: |
          echo "==== Current ExoPlayer / Media3 references ===="
          grep -R "exoplayer\|media3\|com.google.android.exoplayer2" -n . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.kt" \
            --include="*.java" \
            --include="*.xml" || true

      - name: Upgrade Media3 dependency version to 1.10.0
        run: |
          echo "==== Upgrade existing androidx.media3 dependency version to 1.10.0 ===="

          find . $$ -name "*.gradle" -o -name "*.gradle.kts" $$ | while read file; do
            echo "Patching $file"

            sed -i -E 's/(media3Version[[:space:]]*=[[:space:]]*")[^"]+(")/\11.10.0\2/g' "$file" || true
            sed -i -E 's/(media3_version[[:space:]]*=[[:space:]]*")[^"]+(")/\11.10.0\2/g' "$file" || true
            sed -i -E 's/(val[[:space:]]+media3Version[[:space:]]*=[[:space:]]*")[^"]+(")/\11.10.0\2/g' "$file" || true
            sed -i -E 's/(val[[:space:]]+media3_version[[:space:]]*=[[:space:]]*")[^"]+(")/\11.10.0\2/g' "$file" || true
            sed -i -E 's/(def[[:space:]]+media3Version[[:space:]]*=[[:space:]]*")[^"]+(")/\11.10.0\2/g' "$file" || true
            sed -i -E 's/(def[[:space:]]+media3_version[[:space:]]*=[[:space:]]*")[^"]+(")/\11.10.0\2/g' "$file" || true

            sed -i -E 's#androidx\.media3:([^:"]+):[0-9A-Za-z\.\-]+#androidx.media3:\1:1.10.0#g' "$file" || true
          done

      - name: Try migrate old ExoPlayer package to Media3
        run: |
          echo "==== Check old ExoPlayer package usage ===="

          if grep -R "com.google.android.exoplayer2" -n app --include="*.kt" --include="*.java" --include="*.xml"; then
            echo "Old ExoPlayer package found. Trying official Media3 migration script."

            curl -L -o media3-migration.sh https://raw.githubusercontent.com/androidx/media/release/gradle/media3-migration.sh
            chmod +x media3-migration.sh

            ./media3-migration.sh -m -f . || true
          else
            echo "No old ExoPlayer package found."
          fi

      - name: Show patched player dependencies
        run: |
          echo "==== Patched ExoPlayer / Media3 references ===="
          grep -R "exoplayer\|media3\|com.google.android.exoplayer2" -n . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.kt" \
            --include="*.java" \
            --include="*.xml" || true

      - name: Build Debug APK
        run: ./gradlew clean :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: my-tv-0-upgraded-debug-apk
          path: app/build/outputs/apk/debug/*.apk
